<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Intro To HTML</title>
	</head>
	<body>
		<nav>
			<a href="lists.html">Lists</a>
			<a href="table.html">Table</a>
		</nav>
		<!-- Block Elements -->
		<h1>Berkenalan dengan HTML</h1>
		<h2>Subjudul</h2>
		<p>
			lorem ipsum dolor <br />
			<strong>sit amet</strong> consectetur adipiscing elit. <br />
			Ini contoh superscript: E = mc<sup>2</sup>
		</p>
		<!-- Inline Elements -->
		<span>Ini adalah sebuah span</span>
		<a href="#">Ini adalah sebuah link</a>
		<a href="https://daisyui.com/" target="_blank">DaisyUI</a>
		<!-- Image -->
		<figure>
			<img src="images/kufaku.jpg" alt="Kufaku image" />
			<figcaption>Kufaku, band terbaik Indonesia</figcaption>
		</figure>
		<img
			src="https://images.pexels.com/photos/36511076/pexels-photo-36511076.jpeg"
			alt="Pexels image"
		/>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Intro To Forms</title>
	</head>
	<body>
		<form action="https://link-api-luar" method="post">
			<input
				type="text"
				id="username"
				name="username"
				placeholder="Username"
				required
			/>
			<input
				type="email"
				id="email"
				name="email"
				placeholder="Email"
				required
			/>
			<input
				type="password"
				id="password"
				name="password"
				placeholder="Password"
				required
			/>
			<fieldset>
				<legend>Personal Information</legend>
				<label for="firstName">First Name:</label>
				<input
					type="text"
					id="firstName"
					name="firstName"
					placeholder="First Name"
					required
				/>
				<label for="lastName">Last Name:</label>
				<input
					type="text"
					id="lastName"
					name="lastName"
					placeholder="Last Name"
					required
				/>
			</fieldset>
			<button type="submit">Submit</button>
		</form>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
		<title>Product Card</title>
	</head>
	<body>
		<div class="card">
			<img
				src="https://images.pexels.com/photos/9516931/pexels-photo-9516931.jpeg"
				alt="Product Image"
				class="card-image"
			/>
			<section class="card-content">
				<h2 class="card-title fraunces-bold">Product Title</h2>
				<p class="card-description montserrat-normal">
					Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do
					eiusmod tempor incididunt ut labore et dolore magna aliqua.
				</p>
				<button
					class="card-button montserrat-bold"
					style="display: flex; align-items: center; justify-content: center"
				>
					<span style="margin-right: 4px"
						><svg
							aria-hidden="true"
							xmlns="http://www.w3.org/2000/svg"
							width="18"
							height="18"
							fill="none"
							viewBox="0 0 24 24"
						>
							<path
								stroke="currentColor"
								stroke-linecap="round"
								stroke-linejoin="round"
								stroke-width="2"
								d="M4 4h1.5L8 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm.75-3H7.5M11 7H6.312M17 4v6m-3-3h6"
							/>
						</svg>
					</span>
					Buy Now
				</button>
			</section>
		</div>
	</body>
</html>

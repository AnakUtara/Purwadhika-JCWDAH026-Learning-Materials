<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Intro To Lists</title>
	</head>
	<body>
		<!-- Unordered List -->
		<h3>Ini adalah Unordered List</h3>
		<ul>
			<li>Item 01</li>
			<li>Item 02</li>
			<li>Item 03</li>
		</ul>
		<!-- Ordered List -->
		<h3>Ini adalah Ordered List</h3>
		<ol>
			<li>Item 01</li>
			<li>Item 02</li>
			<li>Item 03</li>
		</ol>
	</body>
</html>

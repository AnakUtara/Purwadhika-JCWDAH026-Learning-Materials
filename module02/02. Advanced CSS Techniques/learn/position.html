<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Posisyen</title>
		<style>
			body {
				height: 200vh;
			}

			.square {
				width: 60px;
				height: 60px;
				background-color: black;
				/* position: relative; */
				top: 50px;
				left: 50px;
			}

			.circle {
				width: 30px;
				height: 30px;
				background-color: red;
				border-radius: 100%;
				position: absolute;
				right: 15px;
			}

			.fixed-circle {
				width: 40px;
				height: 40px;
				background-color: blue;
				border-radius: 100%;
				position: fixed;
				bottom: 20px;
				right: 20px;
			}

			#navbar {
				display: flex;
				gap: 16px;
				justify-content: center;
				gap: 8px 16px;
				position: sticky;
				top: 0;
			}

			#hero {
				width: 100%;
				height: 250px;
				object-fit: cover;
			}
		</style>
	</head>
	<body>
		<img
			id="hero"
			src="https://images.pexels.com/photos/37751869/pexels-photo-37751869.jpeg"
			alt="Image"
		/>
		<nav id="navbar">
			<a href="about.html">About</a>
			<a href="posts.html">Posts</a>
		</nav>
		<div class="square">
			<div class="circle">
				<div class="fixed-circle"></div>
			</div>
		</div>
	</body>
</html>
